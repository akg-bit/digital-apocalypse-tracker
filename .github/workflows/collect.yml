name: Sweep feeds

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs a few minutes under load
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["collector/**", "config/**", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Claude SDK (only used if ANTHROPIC_API_KEY is set)
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAT_MODEL: ${{ vars.DAT_MODEL }}
        run: python collector/dat.py

      - name: Commit updated data
        run: |
          git config user.name "dat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "sweep: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
