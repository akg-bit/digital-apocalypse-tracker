name: Keep schedule alive

# GitHub pauses scheduled workflows in repos with no activity for 60 days.
# The sweep commits data constantly, but this is a cheap safety net.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable sweep workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml --repo "${{ github.repository }}"
