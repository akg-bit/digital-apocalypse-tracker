<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Apocalypse Tracker</title>
  <meta name="description" content="A live, automatically updated timeline of major cyber attacks and internet outages, with when they happened and their alleged cause.">
  <meta property="og:title" content="DAT — Digital Apocalypse Tracker">
  <meta property="og:description" content="Live timeline of major cyber attacks and outages, refreshed every 15 minutes.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><rect x='10' y='10' width='12' height='12' fill='%23ff3b30'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=0a567a8f75">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>DAT<span class="slash">/</span><span class="brand-name">Digital Apocalypse Tracker</span></h1>
      </div>
      <div class="sweep" aria-live="polite">
        <span class="live-dot" id="liveDot"></span>
        <span id="sweepText">Loading…</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="Filters">
      <input type="search" id="q" placeholder="Search company, group, cause…" aria-label="Search events">
      <div class="chips" id="chips" role="group" aria-label="Category"></div>
      <div class="selects">
        <label>Range
          <select id="range">
            <option value="1">24 hours</option>
            <option value="7" selected>7 days</option>
            <option value="30">30 days</option>
            <option value="9999">All</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="ongoingOnly"> Ongoing only</label>
      </div>
    </section>

    <section id="timeline" class="timeline" aria-live="polite"></section>
  </main>

  <footer class="wrap foot">
    <details>
      <summary>Sources &amp; health</summary>
      <ul id="health" class="health"></ul>
    </details>
    <p id="aboutLine" class="muted"></p>
    <p class="muted">Causes shown are as alleged by the affected company, officials, researchers or the attackers themselves, and may change as investigations continue. Always check the linked sources.</p>
  </footer>

  <script src="assets/app.js?v=0a567a8f75"></script>
</body>
</html>
